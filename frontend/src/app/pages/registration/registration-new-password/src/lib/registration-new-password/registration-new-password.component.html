<h3 class="h3 auth-heading">Создание пароля</h3>

<p class="auth-text">Придумайте пароль</p>

<form class="flex flex-col" [formGroup]="formGroup" (ngSubmit)="submit()">
  <div class="input-field relative">
    <input
      class="w-full"
      name="password"
      formControlName="password"
      placeholder="Пароль"
      required
      [type]="showPassword ? 'text' : 'password'"
    />

    <svg-icon
      class="eye-icon"
      src="/assets/icons/eye.svg"
      [class.eye-icon_active]="showPassword"
      (click)="showPassword = !showPassword"
    />
  </div>

  <span class="form-field-hint">Обязательное поле для заполнения</span>

  <div class="input-field relative">
    <input
      class="w-full"
      name="confirmPassword"
      formControlName="password2"
      placeholder="Повторите пароль"
      required
      [type]="showConfirmPassword ? 'text' : 'password'"
    />

    <svg-icon
      class="eye-icon"
      src="/assets/icons/eye.svg"
      [class.eye-icon_active]="showConfirmPassword"
      (click)="showConfirmPassword = !showConfirmPassword"
    />
  </div>

  <span class="form-field-hint">Обязательное поле для заполнения</span>

  <span
    class="text-center text-[11px] text-red opacity-0"
    [class.opacity-100]="
      formGroup.get('password2')?.hasError('fieldsMustMatch') &&
      formGroup.get('password2')?.touched
    "
    >Пароли не совпадают</span
  >

  <app-button
    class="auth-button"
    type="submit"
    [loading]="loading$$()"
    [disabled]="isButtonDisabled$$()"
  >
    Подтвердить
  </app-button>
</form>
